name: Validate upstream player PR
on:
  push:
    branches: [upstream-player-validation]
permissions:
  contents: read
jobs:
  player:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libasound2-dev libpulse-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: player-tests
      - run: cargo test --locked -p md3-model -p sf-player --lib
